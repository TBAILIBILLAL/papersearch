services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: papersearch
      POSTGRES_PASSWORD: papersearch
      POSTGRES_DB: papersearch
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papersearch"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://papersearch:papersearch@db:5432/papersearch
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
