[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersearch"
version = "1.0.0"
description = "A search engine for computer science papers, built from scratch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "httpx2>=2"]

[project.scripts]
papersearch = "papersearch.cli:main"

[tool.setuptools]
packages = ["papersearch"]

[tool.setuptools.package-data]
papersearch = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
